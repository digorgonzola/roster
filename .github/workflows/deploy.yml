name: Deploy

# Deploys main to the production Worker ("roster"). D1 migrations run first so
# the new code never queries a table that does not exist yet. Migrations must
# stay backwards compatible with the previous Worker version (additive only),
# because the old code serves traffic until `wrangler deploy` finishes.
#
# This replaces Workers Builds, which cannot run migrations before a deploy.
# Workers Builds must stay disconnected from this Worker, or both deploy.
#
# Security model: runs only on pushes to main (reviewed, merged code) and on
# manual dispatch, never on pull_request events, so PR code never sees the
# production token.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a production deploy half way (between migrate and deploy).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned pnpm version from the packageManager field in
      # package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply roster --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 16d819ae170d010e7f7e936b5dee359d

      # --env="" names the top-level (production) config explicitly, so
      # wrangler does not warn that env.preview exists but was not chosen.
      - name: Deploy Worker
        run: pnpm exec wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 16d819ae170d010e7f7e936b5dee359d
